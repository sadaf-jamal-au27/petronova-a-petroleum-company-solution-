# Ordered platform releases per cluster (scripts/bootstrap-platform.sh)
- name: tenant-platform-system
  chart: ../03-platform-charts/tenant
  namespace: default
  values: [../03-platform-charts/tenant/tenants/platform-system.yaml]
- name: tenant-gateway-infra
  chart: ../03-platform-charts/tenant
  namespace: default
  values: [../03-platform-charts/tenant/tenants/gateway-infra.yaml]
- name: tenant-ot-ingest
  chart: ../03-platform-charts/tenant
  namespace: default
  values: [../03-platform-charts/tenant/tenants/ot-ingest.yaml]
- name: tenant-operations
  chart: ../03-platform-charts/tenant
  namespace: default
  values: [../03-platform-charts/tenant/tenants/operations.yaml]
- name: external-secrets
  repo: https://charts.external-secrets.io
  chart: external-secrets/external-secrets
  version: 0.19.2
  namespace: platform-system
  values: [../03-platform-charts/platform-addons/external-secrets/values.yaml]
- name: petronova-platform
  chart: ../03-platform-charts/platform-addons/petronova-platform
  namespace: platform-system
  values: [../03-platform-charts/platform-addons/petronova-platform/values.yaml]
- name: mosquitto
  chart: ../05-services/mosquitto/chart
  namespace: ot-ingest
  values: [../05-services/mosquitto/chart/values.yaml]
