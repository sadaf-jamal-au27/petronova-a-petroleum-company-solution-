{{- range .Values.cloudArmor.targetServices }}
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: waf-{{ .name }}
  namespace: {{ .namespace }}
spec:
  default:
    securityPolicy: {{ $.Values.cloudArmor.policyName }}
    logging:
      enabled: true
      sampleRate: 1000000
  targetRef:
    group: ""
    kind: Service
    name: {{ .name }}
---
{{- end }}
