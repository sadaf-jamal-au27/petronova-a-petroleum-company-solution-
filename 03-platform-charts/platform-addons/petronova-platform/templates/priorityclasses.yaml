{{- if .Values.priorityClasses }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: petronova-critical
value: 100000
globalDefault: false
description: Operator-facing path (mqtt-bridge, alarm-service, timeseries-api)
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: petronova-batch
value: 1000
globalDefault: false
preemptionPolicy: Never
description: Batch and data jobs; never preempt online services
{{- end }}
