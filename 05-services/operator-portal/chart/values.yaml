team: app-squads
dataClassification: internal
nameOverride: ""
workload: { kind: Deployment, schedule: "", timeZone: Asia/Kolkata }
image:
  repository: asia-south1-docker.pkg.dev/pnlab01-prod-artifacts-0/docker-images/operator-portal
  tag: ""
  digest: ""
replicaCount: 2
gcpServiceAccount: ""
automountServiceAccountToken: false
priorityClassName: ""
podSecurity: { runAsUser: 101 }
command: []
args: []
env: []
config: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
# nginx needs writable cache and pid paths with a read-only root filesystem
extraVolumes:
  - { name: nginx-cache, emptyDir: {} }
  - { name: nginx-run, emptyDir: {} }
extraVolumeMounts:
  - { name: nginx-cache, mountPath: /var/cache/nginx }
  - { name: nginx-run, mountPath: /var/run }
service: { enabled: true, port: 80, targetPort: 8080 }
probes: { enabled: true, readinessPath: /ready, livenessPath: /healthz }
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }
autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, targetCPU: 70 }
pdb: { enabled: true, minAvailable: 1 }
networkPolicy:
  enabled: true
  allowFrom: []
  proxyOnlySubnet: 10.130.8.0/23
externalSecret: { enabled: false, storeName: gcp-secret-manager, refreshInterval: 1h, keys: [] }
cloudSqlProxy: { enabled: false, image: "", instance: "", port: 5432 }
httpRoute:
  enabled: true
  gateway: { name: petronova-gateway, namespace: gateway-infra }
  hostnames: ["portal.dev.gcp.petronova.internal"]
  pathPrefix: /
  stripPrefix: false
metrics: { enabled: false, path: /metrics, interval: 30s }
