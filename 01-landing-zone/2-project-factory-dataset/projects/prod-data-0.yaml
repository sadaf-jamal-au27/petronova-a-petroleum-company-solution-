# Data (prod): Dataflow, Bigtable, BigQuery, GCS archive
parent: $folder_ids:ot-data/prod
services:
  - dataflow.googleapis.com
  - bigtable.googleapis.com
  - bigtableadmin.googleapis.com
  - bigquery.googleapis.com
  - storage.googleapis.com
  - dataplex.googleapis.com
  - compute.googleapis.com
shared_vpc_service_config:
  host_project: $project_ids:net-prod-0
  service_agent_iam:
    "roles/compute.networkUser":
      - $service_agents:dataflow
      - $service_agents:compute
service_encryption_key_ids:
  bigquery.googleapis.com:
    - $kms_keys:bigquery-prod-petronova
  storage.googleapis.com:
    - $kms_keys:storage-prod-petronova
  bigtableadmin.googleapis.com:
    - $kms_keys:storage-prod-petronova
  dataflow.googleapis.com:
    - $kms_keys:compute-prod-petronova
service_accounts:
  dataflow-worker:
    display_name: Dataflow telemetry pipeline workers
    iam_project_roles:
      $project_ids:prod-data-0:
        - roles/dataflow.worker
        - roles/bigtable.user
        - roles/bigquery.dataEditor
        - roles/storage.objectAdmin
      $project_ids:prod-ingest-0:
        - roles/pubsub.subscriber
        - roles/pubsub.publisher
        - roles/pubsub.viewer
labels:
  environment: production
  zone: ot-data
