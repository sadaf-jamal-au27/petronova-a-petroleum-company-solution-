# HQ backup HA VPN over internet; routes carry lower preference than Interconnect (higher MED set on-prem)
name: hq-backup
region: $locations:primary
peer_gateways:
  default:
    external:
      redundancy_type: TWO_IPS_REDUNDANCY
      interfaces:
        - 203.0.113.10   # REPLACE: HQ edge firewall public IP 1
        - 203.0.113.11   # REPLACE: HQ edge firewall public IP 2
router_config:
  create: false
  name: $routers:hub/vpn-as1
tunnels:
  t0:
    bgp_peer: { address: 169.254.21.1, asn: 65010 }
    bgp_session_range: "169.254.21.2/30"
    peer_external_gateway_interface: 0
    shared_secret: "REPLACE_WITH_SECRET_FROM_SECRET_MANAGER"
    vpn_gateway_interface: 0
  t1:
    bgp_peer: { address: 169.254.21.5, asn: 65010 }
    bgp_session_range: "169.254.21.6/30"
    peer_external_gateway_interface: 1
    shared_secret: "REPLACE_WITH_SECRET_FROM_SECRET_MANAGER"
    vpn_gateway_interface: 1
